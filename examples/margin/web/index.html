<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Margin</title>
<link rel="stylesheet" href="margin.css">
</head>
<body>
  <aside class="library">
    <input id="search" class="search" type="search" placeholder="Search notes" autocomplete="off" aria-label="Search notes">
    <button id="new" class="new" type="button">New note</button>
    <h2 id="count">Notes</h2>
    <ul id="notes" class="notes" aria-label="Notes"></ul>
    <footer id="folder" class="folder"></footer>
  </aside>

  <main class="desk">
    <div class="bar">
      <span class="path" id="path"></span>
      <span class="saved" id="saved"></span>
      <span class="words" id="words"></span>
      <button id="edit" class="quiet" type="button" disabled>Edit</button>
      <button id="export" class="quiet" type="button" disabled>Export</button>
    </div>
    <div class="page" id="page">
      <div class="sheet">
        <article id="paper" class="paper" aria-live="polite"></article>
        <textarea id="editor" class="editor" spellcheck="false" aria-label="The note, in Markdown" hidden></textarea>
      </div>
      <div class="margin" id="margin" aria-label="Margin notes"></div>
    </div>
    <button id="add-margin" class="add-margin" type="button" hidden>Add a margin note</button>
  </main>
  <script src="markdown.js"></script>
  <script src="margin.js"></script>
</body>
</html>
