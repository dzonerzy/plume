# Plume on GitHub's hosted runners: the unit tests, the examples run (hello's
# checks, under Xvfb on Linux), and every template created, built and started.
# The engine comes prebuilt from ZeroG's release packages (build.zig.zon).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: The runtime libraries and a headless display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxext6 libxkbcommon0 libwayland-client0 libwayland-egl1 \
            libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri fonts-dejavu-core \
            xvfb xauth dbus dbus-x11 at-spi2-core libdbus-1-3
      - name: Unit tests
        shell: bash
        run: bash .github/retry.sh zig build test
      - name: Build hello, the showcase and the plume tool
        shell: bash
        run: bash .github/retry.sh zig build -Doptimize=ReleaseSmall && bash .github/retry.sh zig build cli -Doptimize=ReleaseSmall
      - name: hello's checks (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./zig-out/bin/hello.exe --smoke
      - name: hello's checks (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a ./zig-out/bin/hello --smoke
      - name: UI tests, headless (no display; one snapshot for both systems)
        shell: bash
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY bash .github/retry.sh zig build ui-test
          env -u DISPLAY -u WAYLAND_DISPLAY zig build margin-test
      - name: The native layer draws (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./zig-out/bin/layer.exe --smoke
      - name: The native layer draws (Linux, Xvfb, Mesa)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" ./zig-out/bin/layer --smoke
      - name: What a failed snapshot left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ runner.os }}
          path: |
            tests/ui/snapshots/
            examples/margin/tests/snapshots/
      - name: The showcase starts (Linux)
        if: runner.os == 'Linux'
        run: |
          for mockup in margin spindle kiln gauge; do
            PLUME_SMOKE=1 dbus-run-session -- xvfb-run -a ./zig-out/bin/showcase $mockup
          done
      - name: The showcase starts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for mockup in margin spindle kiln gauge; do
            PLUME_SMOKE=1 ./zig-out/bin/showcase.exe $mockup
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plume-${{ runner.os }}
          path: zig-out/bin/plume*

  templates:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        template: [vanilla, react, svelte, vue]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: plume
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The runtime libraries and a headless display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxext6 libxkbcommon0 libwayland-client0 libwayland-egl1 \
            libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri fonts-dejavu-core \
            xvfb xauth dbus dbus-x11 libdbus-1-3
      - name: The plume tool
        shell: bash
        run: |
          cd plume
          bash .github/retry.sh zig build cli -Doptimize=ReleaseSmall
          echo "$PWD/zig-out/bin" >> "$GITHUB_PATH"
      - name: plume init, plume build
        shell: bash
        run: |
          plume init app --template ${{ matrix.template }} --plume plume
          cd app
          bash ../plume/.github/retry.sh plume build
      - name: The application starts and loads its page
        shell: bash
        env:
          PLUME_SMOKE: "1"
        run: |
          cd app
          if [ "$RUNNER_OS" = "Linux" ]; then
            dbus-run-session -- xvfb-run -a ./build/bin/app
          else
            ./build/bin/app.exe
          fi
      - name: plume test (the template's UI test, headless)
        shell: bash
        run: cd app && env -u DISPLAY plume test
      - name: plume package
        shell: bash
        run: |
          cd app
          if [ "$RUNNER_OS" = "Linux" ]; then plume package --skip-build --format deb --format tar; else plume package --skip-build --format zip; fi
          ls -la build/package
          # The engine's notices in each package (LGPL WebCore and JavaScriptCore).
          if [ "$RUNNER_OS" = "Linux" ]; then
            tar -tzf build/package/app-*-linux-x64.tar.gz | grep -x './share/doc/app/THIRD_PARTY_NOTICES.txt'
            mkdir deb && (cd deb && ar x ../build/package/app_*_amd64.deb && tar -tzf data.tar.gz | grep -x './usr/share/doc/app/THIRD_PARTY_NOTICES.txt')
          else
            /c/Windows/System32/tar.exe -tf build/package/app-*-windows-x64.zip | grep -x 'THIRD_PARTY_NOTICES.txt'
          fi
